---

version: 2.1

jobs:

  build:
    machine:
      # https://circleci.com/docs/2.0/configuration-reference/#machine
      image: ubuntu-2404:2026.10.1
    environment:
      ANSIBLE_PYTHON_INTERPRETER: /usr/bin/python3
      # the checkout is the role "project" (tests/test.yml)
      ANSIBLE_ROLES_PATH: ..

    steps:
      - run: sudo rm -f /etc/apt/sources.list.d/google* /etc/apt/sources.list.d/heroku*
      - run: sudo apt-get update
      - run: sudo apt remove --assume-yes --purge apparmor
      - run: sudo apt install --assume-yes net-tools ansible-core ansible-lint

      - run: ansible --version
      - run: ansible-lint --version

      - checkout

      - run: ansible-lint

      - run: ansible-playbook tests/test.yml -i tests/inventory --connection=local

      - run:
          command: sudo journalctl --no-pager --unit=redis-server
          when: on_fail
      - run:
          command: sudo cat /etc/redis/users.acl
          when: on_fail
      - run:
          command: sudo cat /var/log/redis/redis-server.log
          when: on_fail

      - run: ansible-playbook tests/test.yml -i tests/inventory --connection=local

      - run: redis-cli --version
      - run: redis-cli INFO
      # the modules are loaded: search and time series answer
      - run: redis-cli MODULE LIST | grep -x search
      - run: redis-cli MODULE LIST | grep -x timeseries
      - run: redis-cli FT._LIST
      - run: redis-cli TS.ADD probe 1 1
      - run: netstat -lnp
