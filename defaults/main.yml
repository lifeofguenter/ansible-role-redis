---

redis_bind: 127.0.0.1

redis_munin_connect: '{{ redis_bind }}'

redis_maxmemory: 1g

redis_maxmemory_policy: allkeys-lru

# The major release followed: packages.redis.io's newest of it is installed
# on every run, and nothing else.
redis_version: 8

# The modules loaded at start, of those packages.redis.io's Redis comes
# with: search and query (FT.*), time series (TS.*), JSON and the
# probabilistic types (BF.* and the others).
redis_modules:
  - redisearch
  - redistimeseries
  - rejson
  - redisbloom

redis_tls_ca_cert_dir: /etc/ssl/certs

redis_protected_mode: 'yes'

redis_port: 0
